<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highmark — Onboarding</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #090d18;
  --surface:    #0f1623;
  --card:       #151e30;
  --card-hover: #1a2540;
  --accent:     #3b82f6;
  --accent-dim: rgba(59,130,246,.12);
  --green:      #22c55e;
  --text:       #f1f5f9;
  --muted:      #94a3b8;
  --border:     rgba(255,255,255,.08);
  --danger:     #ef4444;
  --warning:    #f59e0b;
  --radius:     12px;
  --max:        1100px;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(9,13,24,.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}
nav .inner {
  max-width: var(--max); margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.nav-logo { font-size: 1.2rem; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
.nav-logo span { color: var(--accent); }
.nav-login { color: var(--muted); font-size: .88rem; font-weight: 500; cursor: pointer; transition: color .15s; background: none; border: none; }
.nav-login:hover { color: var(--text); text-decoration: none; }

.wrap {
  padding: 56px 20px 80px;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(59,130,246,.12) 0%, transparent 70%);
  display: flex; flex-direction: column; align-items: center;
}
h1 {
  font-size: clamp(1.6rem, 3.5vw, 2rem);
  font-weight: 800; letter-spacing: -.02em; line-height: 1.2;
  margin-bottom: 8px;
}
h1 .spinner-icon { vertical-align: -3px; margin-right: 10px; }
.sub { color: var(--muted); font-size: 1rem; margin-bottom: 24px; line-height: 1.55; }
.sub b { color: var(--text); }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px;
  width: 100%; max-width: 640px;
}
.spinner-icon {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(59,130,246,.25); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.section-title {
  font-size: .78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); margin: 22px 0 10px;
}
.row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  gap: 16px;
}
.row:last-of-type { border-bottom: none; }
.row .k {
  color: var(--muted); font-size: .78rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em;
  flex-shrink: 0;
}
.row .v {
  color: var(--text); font-size: .95rem; text-align: right;
  max-width: 65%; word-break: break-word;
}
.warning-list { list-style: none; padding: 0; margin: 14px 0; }
.warning-list li {
  background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.25);
  border-radius: 8px; color: #fcd34d;
  padding: 11px 14px; margin-bottom: 8px; font-size: .9rem;
}

.btn {
  background: var(--accent); color: #fff;
  font-weight: 700; font-size: 1rem;
  border: none; border-radius: 10px;
  padding: 13px 24px; cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn:hover:not(:disabled) { background: #2563eb; transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: transparent; color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) {
  border-color: var(--accent); color: var(--text); background: var(--accent-dim);
}
.actions {
  margin-top: 28px;
  display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;
}

.error {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5; border-radius: 8px;
  padding: 12px 14px; font-size: .9rem; margin-bottom: 16px;
}
.muted { color: var(--muted); font-size: .88rem; }
.muted code { background: rgba(255,255,255,.05); padding: 1px 6px; border-radius: 4px; font-size: .85em; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a href="/" class="nav-logo">High<span>mark</span></a>
    <button id="signOutLink" class="nav-login">Sign out</button>
  </div>
</nav>

<div class="wrap">
  <div class="card" id="card">
    <h1><span class="spinner-icon"></span>Loading your onboarding…</h1>
  </div>
</div>

<script>
(async () => {
  let sbClient, token;
  try {
    const cfg = await fetch('/portal/config').then(r => r.json());
    sbClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    token    = localStorage.getItem('hm_portal_token');
    if (!token) { window.location.replace('/portal/login'); return; }

    const { data: { session } } = await sbClient.auth.getSession();
    if (session?.access_token) {
      token = session.access_token;
      localStorage.setItem('hm_portal_token', token);
    }
  } catch (err) {
    showError('Could not connect to onboarding service.');
    return;
  }

  document.getElementById('signOutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    try { await sbClient.auth.signOut(); } catch {}
    localStorage.removeItem('hm_portal_token');
    localStorage.removeItem('hm_portal_refresh');
    window.location.replace('/');
  });

  let pollTimer = null;
  await refresh();

  async function refresh() {
    try {
      const r = await fetch('/portal/api/onboarding/status', {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (r.status === 401) { window.location.replace('/portal/login'); return; }
      const data = await r.json();

      if (!r.ok) {
        showError(data.error || ('Could not load onboarding status (' + r.status + ').'));
        return;
      }

      render(data);

      if (data.status === 'processing') {
        pollTimer = setTimeout(refresh, 3000);
      }
    } catch (err) {
      showError('Failed to check onboarding status. Retrying…');
      pollTimer = setTimeout(refresh, 5000);
    }
  }

  function render(data) {
    const card = document.getElementById('card');

    if (data.status === 'approved' || (data.clientId && data.status === 'saved')) {
      window.location.replace('/portal/dashboard');
      return;
    }

    if (data.status === 'none') {
      card.innerHTML = `
        <h1>No onboarding in progress</h1>
        <p class="sub">It looks like your account isn't linked to an active onboarding draft. Contact support if this seems wrong.</p>
        <div class="actions"><a class="btn btn-secondary" href="/signup">Start over</a></div>
      `;
      return;
    }

    if (data.status === 'failed') {
      card.innerHTML = `
        <h1>We couldn't finish setup</h1>
        <p class="sub">Something went wrong while analyzing your site${data.errorMessage ? ': <code>' + escapeHtml(data.errorMessage) + '</code>' : '.'}</p>
        <p class="sub">Reach out to <a href="mailto:hello@whiteoutsolutions.co">support</a> and we'll get you set up manually.</p>
      `;
      return;
    }

    if (data.status === 'processing') {
      const pages = data.pagesCrawled || 0;
      card.innerHTML = `
        <h1><span class="spinner-icon"></span>Building your bot…</h1>
        <p class="sub">We're crawling <b>${escapeHtml(data.sourceUrl || 'your site')}</b> and drafting your bot's knowledge base. This usually takes 30–90 seconds.</p>
        <div class="muted">Pages analyzed so far: ${pages}</div>
      `;
      return;
    }

    if (data.status === 'draft') {
      const c = data.draft?.client  || {};
      const b = data.draft?.bot     || {};
      const k = data.draft?.booking || {};
      const warnings = data.warnings || [];
      const services = Array.isArray(c.services) ? c.services.join(', ') : '—';

      card.innerHTML = `
        <h1>Review your bot</h1>
        <p class="sub">We analyzed ${data.pagesCrawled || 0} page${data.pagesCrawled === 1 ? '' : 's'} from your site. Review the draft below — you can fine-tune everything later.</p>

        <div class="section-title">Business</div>
        <div class="row"><span class="k">Name</span><span class="v">${escapeHtml(c.name || '—')}</span></div>
        <div class="row"><span class="k">Industry</span><span class="v">${escapeHtml(c.industry || '—')}</span></div>
        <div class="row"><span class="k">Website</span><span class="v">${escapeHtml(c.website_url || '—')}</span></div>
        <div class="row"><span class="k">Phone</span><span class="v">${escapeHtml(c.support_phone || '—')}</span></div>
        <div class="row"><span class="k">Email</span><span class="v">${escapeHtml(c.support_email || '—')}</span></div>
        <div class="row"><span class="k">Services</span><span class="v">${escapeHtml(services)}</span></div>
        <div class="row"><span class="k">Hours</span><span class="v">${escapeHtml(c.hours || '—')}</span></div>

        <div class="section-title">Bot</div>
        <div class="row"><span class="k">Bot name</span><span class="v">${escapeHtml(b.bot_name || '—')}</span></div>
        <div class="row"><span class="k">Tone</span><span class="v">${escapeHtml(b.tone || '—')}</span></div>

        <div class="section-title">Booking</div>
        <div class="row"><span class="k">Mode</span><span class="v">${escapeHtml(k.booking_mode || 'informational')}</span></div>
        <div class="row"><span class="k">Platform</span><span class="v">${escapeHtml(k.booking_platform || 'none')}</span></div>
        ${k.booking_link ? `<div class="row"><span class="k">Link</span><span class="v">${escapeHtml(k.booking_link)}</span></div>` : ''}

        ${warnings.length > 0 ? `
          <div class="section-title">Heads up</div>
          <ul class="warning-list">${warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul>
        ` : ''}

        <div id="approveError"></div>

        <div class="actions">
          <button id="approveBtn" class="btn">Looks good — create my bot</button>
        </div>
      `;

      document.getElementById('approveBtn').addEventListener('click', approve);
      return;
    }

    showError('Unexpected onboarding state: ' + (data.status ?? 'unknown'));
  }

  async function approve() {
    const btn = document.getElementById('approveBtn');
    const err = document.getElementById('approveError');
    err.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Creating your bot…';

    try {
      const r = await fetch('/portal/api/onboarding/approve', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.innerHTML = `<div class="error">${escapeHtml(data.error || 'Could not create your bot. Try again.')}</div>`;
        btn.disabled = false;
        btn.textContent = 'Looks good — create my bot';
        return;
      }
      window.location.replace('/portal/dashboard');
    } catch (e) {
      err.innerHTML = '<div class="error">Network error. Please try again.</div>';
      btn.disabled = false;
      btn.textContent = 'Looks good — create my bot';
    }
  }

  function showError(msg) {
    document.getElementById('card').innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();
</script>
</body>
</html>
