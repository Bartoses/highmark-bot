<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept Invite — Highmark Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0d0d0d;
  --panel:  #131313;
  --border: #252525;
  --text:   #e0e0e0;
  --text2:  #888;
  --accent: #10b981;
  --accent2:#059669;
  --danger: #ef4444;
  --font:   -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
body { display: flex; align-items: center; justify-content: center; padding: 20px; }

.card {
  width: 100%; max-width: 400px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 36px 32px;
}
.brand {
  font-size: 18px; font-weight: 700; letter-spacing: .03em;
  margin-bottom: 28px; text-align: center;
}
.brand span { color: var(--accent); }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.subtitle { color: var(--text2); font-size: 13px; margin-bottom: 28px; }
.email-display {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
  font-size: 14px; color: var(--text2); margin-bottom: 24px;
  word-break: break-all;
}
.form-group { margin-bottom: 18px; }
label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
input[type="password"] {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--text);
  outline: none; transition: border-color .15s;
}
input[type="password"]:focus { border-color: var(--accent); }
.hint { font-size: 11px; color: var(--text2); margin-top: 5px; }
.btn {
  width: 100%; padding: 11px 20px; font-size: 14px; font-weight: 600;
  border-radius: 8px; border: none; cursor: pointer; transition: background .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent2); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.msg {
  border-radius: 8px; padding: 10px 14px; font-size: 13px;
  margin-bottom: 18px; display: none;
}
.msg.error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
.msg.success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25); color: #6ee7b7; }
.login-link { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text2); }
.login-link a { color: var(--accent); text-decoration: none; }
.login-link a:hover { text-decoration: underline; }
.loading-state { text-align: center; color: var(--text2); padding: 20px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">High<span>mark</span></div>

  <div id="loadingState" class="loading-state">Verifying invite…</div>

  <div id="acceptForm" style="display:none">
    <h1>Accept your invite</h1>
    <p class="subtitle">Set a password to activate your portal account.</p>

    <div class="email-display" id="inviteEmail">—</div>

    <div class="msg" id="errMsg"></div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
      <div class="hint">Minimum 8 characters</div>
    </div>
    <div class="form-group">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" placeholder="Re-enter password" autocomplete="new-password">
    </div>

    <button class="btn btn-primary" id="submitBtn">Activate account</button>
    <div class="login-link">Already have an account? <a href="/portal/login">Sign in</a></div>
  </div>

  <div id="errorState" style="display:none">
    <h1>Invite unavailable</h1>
    <p class="subtitle" id="errorDetail" style="margin-bottom:24px;"></p>
    <div class="login-link"><a href="/portal/login">Go to login →</a></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token') ?? '';
let sbClient = null;
let inviteEmail = '';

async function init() {
  // Load Supabase config for sign-in after accept
  try {
    const cfg = await fetch('/portal/config').then(r => r.json());
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      sbClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }
  } catch {}

  if (!token) {
    showError('No invite token found. Check your invite link.');
    return;
  }

  // Fetch invite metadata
  const res  = await fetch(`/portal/api/invite-info?token=${encodeURIComponent(token)}`);
  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    showError(data.error ?? 'This invite is no longer valid.');
    return;
  }

  inviteEmail = data.email ?? '';
  document.getElementById('inviteEmail').textContent = inviteEmail;
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('acceptForm').style.display   = '';

  document.getElementById('submitBtn').addEventListener('click', handleSubmit);
  document.getElementById('password2').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
}

async function handleSubmit() {
  const btn  = document.getElementById('submitBtn');
  const pw1  = document.getElementById('password').value;
  const pw2  = document.getElementById('password2').value;

  if (pw1.length < 8) { showFormError('Password must be at least 8 characters.'); return; }
  if (pw1 !== pw2)    { showFormError('Passwords do not match.'); return; }

  btn.disabled = true;
  btn.textContent = 'Activating…';
  hideFormError();

  // 1. Call server to create user + portal_users row
  const acceptRes  = await fetch('/portal/api/accept-invite', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ token, password: pw1 }),
  });
  const acceptData = await acceptRes.json().catch(() => ({}));

  if (!acceptRes.ok) {
    btn.disabled = false;
    btn.textContent = 'Activate account';
    showFormError(acceptData.error ?? 'Something went wrong. Please try again.');
    return;
  }

  // 2. Sign in client-side to get session
  if (sbClient) {
    try {
      const { data: session, error: signInErr } = await sbClient.auth.signInWithPassword({
        email:    inviteEmail,
        password: pw1,
      });
      if (!signInErr && session?.session) {
        localStorage.setItem('hm_portal_token',   session.session.access_token);
        localStorage.setItem('hm_portal_refresh', session.session.refresh_token ?? '');
        window.location.replace('/portal/dashboard');
        return;
      }
    } catch {}
  }

  // Fallback: account created but couldn't auto sign-in — redirect to login
  window.location.replace('/portal/login?activated=1');
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('acceptForm').style.display   = 'none';
  const st = document.getElementById('errorState');
  document.getElementById('errorDetail').textContent = msg;
  st.style.display = '';
}

function showFormError(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.className = 'msg error';
  el.style.display = 'block';
}

function hideFormError() {
  document.getElementById('errMsg').style.display = 'none';
}

init().catch(err => {
  console.error('Accept init error:', err);
  showError('Something went wrong loading this invite. Please try again.');
});
</script>
</body>
</html>
