<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E131B">
<title>Ride Log</title>
<style>
  :root { --ink:#0E131B; --muted:#5B6673; --line:#E3E6EA; --bg:#F4F6F8; --card:#FFFFFF; --acc:#F99E16; --acc-ink:#0E131B; --ok:#1F7A4D; --warn:#B4321F; --warnbg:#FDECEA; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--ink); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 10px; }
  header h1 { margin:0; font-size:20px; letter-spacing:.3px; }
  header .sub { color:#B8C2CC; font-size:14px; display:flex; justify-content:space-between; gap:8px; }
  header .sub a { color:#fff; }
  .seg { display:flex; gap:6px; margin-top:10px; }
  .seg button { flex:1; min-height:40px; border-radius:10px; border:1px solid #3A4654; background:transparent; color:#fff; font-family:inherit; font-weight:700; font-size:15px; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:12px 16px 120px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 10px; }
  button.card { width:100%; text-align:left; font:inherit; color:inherit; display:block; cursor:pointer; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .time { font-weight:800; font-size:17px; }
  .label { font-weight:700; }
  .meta { color:var(--muted); font-size:14px; }
  .pill { display:inline-block; font-size:12px; font-weight:800; letter-spacing:.4px; border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .pill.new { background:#EEF1F4; color:var(--muted); } .pill.started { background:#FFF3DF; color:#8A5A12; } .pill.done { background:#E2F3EA; color:var(--ok); }
  .pill.mine { background:var(--ink); color:#fff; } .pill.bad { background:var(--warnbg); color:var(--warn); } .pill.good { background:#E2F3EA; color:var(--ok); }
  .btn { display:block; width:100%; min-height:48px; border:0; border-radius:12px; font-family:inherit; font-weight:700; font-size:16px; line-height:1.2; padding:14px; cursor:pointer; text-align:center; text-decoration:none; }
  .btn.primary { background:var(--acc); color:var(--acc-ink); } .btn.dark { background:var(--ink); color:#fff; } .btn.ghost { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .btn.small { min-height:40px; padding:9px 12px; font-size:15px; width:auto; display:inline-block; }
  .btn:disabled { opacity:.5; }
  h2 { font-size:18px; margin:18px 0 8px; }
  label.f { display:block; font-weight:700; font-size:14px; margin:12px 0 4px; }
  input[type=text], input[type=number], input[type=time], input:not([type]), textarea, select { width:100%; font-family:inherit; font-size:16px; padding:12px; border:1px solid #C9D0D7; border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:72px; }
  .hint { color:var(--muted); font-size:13px; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:40px; padding:8px 14px; border-radius:999px; border:1px solid #C9D0D7; background:#fff; font-family:inherit; font-weight:600; font-size:15px; color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .ph { position:relative; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:#DDE2E7; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph .star, .ph .del { position:absolute; top:4px; min-width:36px; height:36px; border-radius:18px; border:0; background:rgba(14,19,27,.7); color:#fff; font-size:18px; }
  .ph .star { left:4px; } .ph .del { right:4px; font-size:15px; }
  .ph .star[aria-pressed="true"] { background:var(--acc); color:var(--ink); }
  .ph.up { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .rider { border-top:1px solid var(--line); padding:12px 0; }
  .rider:first-child { border-top:0; padding-top:0; }
  .rider .nm { font-weight:700; }
  .note { font-size:14px; margin-top:4px; } .note b { font-weight:700; }
  .note.health { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:6px 8px; }
  .riders label { display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--line); }
  .riders input { width:22px; height:22px; }
  .back { background:none; border:0; color:#fff; font-family:inherit; font-weight:700; font-size:15px; padding:6px 0; margin-bottom:4px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(244,246,248,.96); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width:640px; margin:0 auto; display:flex; gap:8px; } .bar .btn { flex:1; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:90px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; display:none; z-index:20; max-width:90vw; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  .err { background:var(--warnbg); color:var(--warn); border-color:#F5C6C0; }
  .stoprow { display:grid; grid-template-columns:1fr 110px 44px; gap:6px; margin-bottom:6px; }
  .stoprow button { border:1px solid #C9D0D7; background:#fff; border-radius:10px; font-size:18px; color:var(--muted); }
  .map { width:100%; border-radius:10px; display:block; margin:8px 0; border:1px solid var(--line); }
  .role { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px; margin:0 0 10px; font-family:inherit; color:var(--ink); cursor:pointer; }
  .role b { display:block; font-size:18px; } .role span { color:var(--muted); font-size:14px; }
  .daynav { display:grid; grid-template-columns:44px 1fr 44px auto; gap:6px; margin-top:10px; }
  .daynav button { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:40px; border-radius:10px; border:1px solid #3A4654; background:transparent; color:#fff; font-family:inherit; font-weight:700; font-size:15px; padding:0 10px; }
  .daynav button:disabled { opacity:.35; }
  .daynav .cur { background:#fff; color:var(--ink); }
  .nextcard { text-align:left; }
  button.card.day { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .day .dn { font-weight:800; font-size:16px; min-width:92px; }
  .day.past { opacity:.6; }
  .day.today { border:2px solid var(--acc); }
  .locs { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .loc { font-size:12px; font-weight:700; border-radius:999px; padding:2px 8px; background:#EEF1F4; color:var(--muted); white-space:nowrap; }
  h3.mo { font-size:14px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
  .spin { display:inline-block; width:22px; height:22px; border:3px solid #D5DBE1; border-top-color:var(--acc); border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #busy { position:fixed; top:0; left:0; height:3px; width:100%; z-index:30; background:linear-gradient(90deg,transparent,var(--acc),transparent); background-size:50% 100%; background-repeat:no-repeat; animation:bz 1s linear infinite; display:none; }
  @keyframes bz { from { background-position:-50% 0; } to { background-position:150% 0; } }
  .money { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; margin-top:4px; }
  .money b { font-weight:800; } .owe { color:var(--warn); font-weight:700; }
  .src { font-size:12px; font-weight:700; border-radius:999px; padding:2px 8px; background:#E8EEF8; color:#2C4A7A; white-space:nowrap; }
  .shut { font-size:14px; margin-top:6px; background:#EEF6F1; color:#1F5A3D; border-radius:8px; padding:6px 8px; }
  .bguide { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; margin-top:8px; }
  .bguide select { padding:8px 10px; font-size:15px; }
  .stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat div { background:#F4F6F8; border-radius:10px; padding:8px; } .stat b { display:block; font-size:18px; } .stat span { font-size:12px; color:var(--muted); }
  .rrow { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .rrow:first-of-type { border-top:0; } .rrow i { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--acc); display:block; }
  .unit { display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:700; background:#FFF3DF; color:#7A4E0F; border-radius:8px; padding:4px 8px; margin:6px 6px 0 0; }
  .unit button, .snote button { border:0; background:none; color:inherit; font-size:15px; padding:0 2px; min-width:24px; min-height:24px; }
  .addrow { display:grid; grid-template-columns:88px minmax(0,1fr) auto; gap:6px; margin-top:8px; }
  .addrow select, .addrow input { padding:8px 10px; font-size:16px; min-width:0; }
  .snote { font-size:14px; background:#F4F6F8; border-radius:8px; padding:6px 8px; margin-top:6px; display:flex; justify-content:space-between; gap:8px; }
  .snote .by { color:var(--muted); font-size:12px; }
  .run { border-left:4px solid var(--acc); }
  .stop { border-top:1px solid var(--line); padding:8px 0; font-size:14px; } .stop:first-child { border-top:0; }
  .pick label { display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--line); font-size:15px; }
  .pick input { width:22px; height:22px; flex:none; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="busy"></div><header><div id="hd"></div></header>
<main id="main"><div class="empty"><span class="spin"></span>Loading…</div></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple class="sr" aria-label="Add photos">
<input type="file" id="mapfile" accept="image/png,image/jpeg" class="sr" aria-label="Upload route map">
<script>
(function () {
  var T = new URLSearchParams(location.search).get("t") || "";
  var TEAM = null;
  try { TEAM = JSON.parse(localStorage.getItem("guideTeam") || "null"); } catch (e) { TEAM = null; }
  if (!T && TEAM && TEAM.code && TEAM.phone) T = "team:" + TEAM.code + ":" + TEAM.phone;
  var S = { day: null, date: null, today: null, open: null, tab: "bookings", sub: "tours", admin: null, editTour: null, editStaff: null, uploading: 0, queue: [], drafts: {}, view: null, loc: null, season: false, seasonData: null, seasonTab: "days", editRun: null };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var COND = [["fresh_snow", "Fresh snow"], ["bluebird", "Bluebird"], ["snowing", "Snowing"], ["windy", "Windy"], ["cold", "Cold"]];
  var VIEW_INFO = { guide: ["Guide", "My bookings today: manifest, photos and the ride log"], shop: ["Shop", "Rentals at pick-up and return: manifest and photos"], manager: ["Manager", "Every booking, assigning staff, and settings"] };
  var LOC = {}; 
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = "none"; }, 2600); }
  function time(iso) { try { return new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Denver" }).replace(":00", ""); } catch (e) { return ""; } }
  function dayName(d) { try { return new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }); } catch (e) { return d; } }
  function addD(d, n) { var x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function canLog() { return S.date === S.today || S.date === addD(S.today, -1); }   // photos + ride details: today or the morning after
  function api(method, path, body) {
    var opts = { method: method, headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(Object.assign({ t: T, as: S.view }, body));
    var url = path + (method === "GET" ? (path.indexOf("?") > -1 ? "&" : "?") + "t=" + encodeURIComponent(T) + (S.view ? "&as=" + S.view : "") : "");
    busy(1);
    return fetch(url, opts).finally(function () { busy(-1); }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || "Something went wrong"); e.status = r.status; throw e; } return j; }); });
  }
  var pending = 0;
  function busy(n) { pending = Math.max(0, pending + n); $("busy").style.display = pending ? "block" : "none"; }
  function money(c) { return "$" + Math.round((Number(c) || 0) / 100).toLocaleString("en-US"); }
  // ── back navigation: every sub-screen is a history entry, so the browser back button and swipe-back work ──
  function enter(fn) { fn(); try { history.pushState({ sub: 1 }, ""); } catch (e) {} render(); scrollTo(0, 0); }
  function popLevel() {
    if (S.open && S.uploading && !confirm("Photos are still uploading. Leave anyway?")) { try { history.pushState({ sub: 1 }, ""); } catch (e) {} return; }
    captureDraft();
    if (S.editRun) S.editRun = null; else if (S.editTour) S.editTour = null; else if (S.editStaff) S.editStaff = null;
    else if (S.open) S.open = null; else if (S.season) S.season = false;
    render();
  }
  function goBack() { if (history.state && history.state.sub) history.back(); else popLevel(); }
  window.addEventListener("popstate", popLevel);
  (function swipe() {     // swipe right (not from the very edge, which the browser uses for its own back) = back
    var x0 = null, y0 = 0, t0 = 0;
    document.addEventListener("touchstart", function (e) { var t = e.touches[0]; if (e.touches.length !== 1 || t.clientX < 30 || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { x0 = null; return; } x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (x0 === null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0); x0 = null;
      if (dx > 90 && dy < 50 && Date.now() - t0 < 600 && (S.open || S.season || S.editTour || S.editStaff || S.editRun)) goBack();
    }, { passive: true });
  })();
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  // ── load + routing ──
  function load(date) {
    return api("GET", "/guide/api/day" + (date ? "?d=" + date : "")).then(function (j) {
      S.day = j; S.date = j.date; S.today = j.today;
      var views = (j.me && j.me.views) || [];
      if (!S.view) {
        var saved = store.get("guideView");
        if (views.length === 1) S.view = views[0];
        else if (saved && views.indexOf(saved) > -1) S.view = saved;
        else return renderRolePicker(views);
        if (j.me.view !== S.view) return load(date);              // first answer used the default view
      }
      render();
    }).catch(function (e) {
      if (T.indexOf("team:") === 0 && (e.status === 401 || e.status === 403)) { try { localStorage.removeItem("guideTeam"); } catch (x) {} T = ""; return renderTeamCode(e.message); }
      $("hd").innerHTML = "<h1>Ride Log</h1>";
      $("main").innerHTML = '<div class="card err">' + esc(e.message) + "</div>";
    });
  }
  function dep(pk) { return ((S.day && S.day.departures) || []).filter(function (d) { return String(d.availability_pk) === String(pk); })[0]; }
  function captureDraft() {
    if (!S.open || !$("miles")) return;
    S.drafts[S.open] = { miles: $("miles").value, high_point_ft: $("hp").value, stops: $("stops").value, highlight: $("hl").value, group_note: $("note").value,
      conditions: Array.prototype.filter.call(document.querySelectorAll("#cond .chip"), function (c) { return c.getAttribute("aria-pressed") === "true"; }).map(function (c) { return c.getAttribute("data-c"); }) };
  }
  function render() {
    captureDraft();
    if (S.tab === "settings" && S.view === "manager") {
      if (S.sub === "tours") return S.editTour ? renderTourEdit() : renderTours();
      if (S.sub === "staff") return S.editStaff ? renderStaffEdit() : renderStaff();
      return renderSettings();
    }
    if (S.editRun) return renderRunEdit();
    if (S.season) return renderSeason();
    if (S.open && dep(S.open)) renderRide(dep(S.open)); else { S.open = null; renderList(); }
  }

  // ── role picker ──
  function renderRolePicker(views) {
    var me = (S.day && S.day.me) || {};
    $("hd").innerHTML = "<h1>Ride Log</h1><div class='sub'><span>" + esc(me.name || "") + "</span></div>";
    $("bar").hidden = true;
    $("main").innerHTML = "<h2>What are you working as today?</h2>" + views.map(function (v) {
      return "<button class='role' data-v='" + v + "'><b>" + VIEW_INFO[v][0] + "</b><span>" + VIEW_INFO[v][1] + "</span></button>";
    }).join("") + "<p class='hint'>You can switch any time from the top of the screen.</p>";
    each(".role", function (b) { b.onclick = function () { S.view = b.getAttribute("data-v"); store.set("guideView", S.view); S.tab = "bookings"; S.loc = null; load(S.date); }; });
  }
  function headerTop(title) {
    var me = (S.day && S.day.me) || {}, multi = (me.views || []).length > 1;
    return "<h1>" + esc(title) + "</h1><div class='sub'><span>" + esc(me.name || "") + " · " + VIEW_INFO[S.view][0] + "</span><span>" +
      (multi ? "<a href='#' id='switchRole'>Switch role</a>" : "") + (T.indexOf("team:") === 0 ? " &nbsp;<a href='#' onclick='window.__signOut();return false'>Not you?</a>" : "") + "</span></div>";
  }
  function wireHeader() {
    if ($("switchRole")) $("switchRole").onclick = function (e) { e.preventDefault(); S.view = null; S.open = null; S.tab = "bookings"; store.set("guideView", ""); renderRolePicker(S.day.me.views); };
    each(".tabs button", function (b) { b.onclick = function () { S.tab = b.getAttribute("data-tab"); S.open = null; S.editTour = null; S.editStaff = null; if (S.tab !== "bookings" && !S.admin) loadAdmin(); else render(); }; });
    each(".subs button", function (b) { b.onclick = function () { S.sub = b.getAttribute("data-sub"); S.editTour = null; S.editStaff = null; render(); }; });
  }
  function tabs() {
    if (S.view !== "manager") return "";
    var h = "<div class='seg tabs'>" + [["bookings", "Bookings"], ["settings", "Settings"]].map(function (t) {
      return "<button data-tab='" + t[0] + "' aria-pressed='" + (S.tab === t[0]) + "'>" + t[1] + "</button>"; }).join("") + "</div>";
    if (S.tab === "settings") h += "<div class='seg subs'>" + [["tours", "Tours"], ["email", "Recap email"], ["staff", "Staff"]].map(function (t) {
      return "<button data-sub='" + t[0] + "' aria-pressed='" + (S.sub === t[0]) + "'>" + t[1] + "</button>"; }).join("") + "</div>";
    return h;
  }

  // ── rides list ──
  function locLabel(k) { var l = (S.day.locations || []).filter(function (x) { return x.key === k; })[0]; return l ? l.label : ""; }
  function renderList() {
    var mgr = S.view === "manager";
    if (S.loc === null) { var saved = store.get("guideLoc"); S.loc = saved !== null && saved !== undefined ? saved : (S.view === "manager" ? "" : (S.day.me.home_location || "")); }
    $("hd").innerHTML = headerTop("Bookings") + tabs() +
      "<div class='daynav'><button id='prevD' aria-label='Previous day'" + (!mgr && S.date <= addD(S.today, -1) ? " disabled" : "") + ">‹</button>" +
      "<button id='todayD' class='" + (S.date === S.today ? "cur" : "") + "'>" + esc(relDay(S.date).replace(/^(Today|Tomorrow|Yesterday) · \w+, /, "$1 · ")) + "</button>" +
      "<button id='nextD' aria-label='Next day'" + (!mgr && S.date >= addD(S.today, 60) ? " disabled" : "") + ">›</button>" +
      "<button id='seasonB'>" + (mgr ? "Season" : "Upcoming") + "</button></div>";
    wireHeader();
    $("prevD").onclick = function () { load(addD(S.date, -1)); };
    $("nextD").onclick = function () { load(addD(S.date, 1)); };
    $("todayD").onclick = function () { if (S.date !== S.today) load(S.today); };
    $("seasonB").onclick = function () { enter(function () { S.season = true; S.open = null; }); };
    var allDeps = S.day.departures || [];
    var counts = {}; allDeps.forEach(function (d) { counts[d.location] = (counts[d.location] || 0) + 1; });
    var chips = "<div class='chips' style='margin:0 0 10px'><button class='chip' data-loc='' aria-pressed='" + (S.loc === "") + "'>All · " + allDeps.length + "</button>" +
      (S.day.locations || []).map(function (l) { return "<button class='chip' data-loc='" + l.key + "' aria-pressed='" + (S.loc === l.key) + "'>" + esc(l.label) + " · " + (counts[l.key] || 0) + "</button>"; }).join("") + "</div>";
    // your own bookings always show; the location filter narrows everything else
    var list = allDeps.filter(function (d) { return (d.mine && S.view !== "manager") || !S.loc || d.location === S.loc; });
    $("bar").hidden = true;
    var wireChips = function () { each("[data-loc]", function (c) { c.onclick = function () { S.loc = c.getAttribute("data-loc"); store.set("guideLoc", S.loc); render(); }; }); };
    var nx = S.day.next;

      "<div class='meta'>" + nx.bookings + " booking" + (nx.bookings === 1 ? "" : "s") + " · " + nx.riders + " riders" + (nx.mine ? " · " + nx.mine + " yours" : "") + " ›</div></button>" : "";
    var wireNext = function () { if ($("goNext")) $("goNext").onclick = function () { load(nx.date); }; };

      $("main").innerHTML = chips + "<div class='empty'>Nothing " + esc(relDay(S.date).toLowerCase().indexOf("today") === 0 ? "today" : "on " + dayName(S.date)) + (S.loc ? " at " + esc(locLabel(S.loc)) : "") + (mgr ? "" : " for you") + ".</div>" +

        "<div class='meta'>" + esc(locLabel(d.location)) + " · " + d.riders + " rider" + (d.riders === 1 ? "" : "s") + (d.names.length ? " · " + esc(d.names.slice(0, 4).join(", ")) + (d.names.length > 4 ? "…" : "") : "") + "</div></div>" +
        "<span class='pill " + d.status + "'>" + (d.status === "done" ? "DONE" : d.status === "started" ? (d.photos.length + " PHOTO" + (d.photos.length === 1 ? "" : "S")) : "TO DO") + "</span></div>" +
        (mgr && d.total_cents != null ? "<div class='money'><span><b>" + money(d.total_cents) + "</b></span>" + (d.due_cents ? "<span class='owe'>owes " + money(d.due_cents) + "</span>" : "<span class='meta'>paid</span>") +
          srcList(d) + "</div>" : "") + (d.shuttle_seats ? "<div class='meta' style='margin-top:4px'>🚐 " + d.shuttle_seats + " shuttle seat" + (d.shuttle_seats === 1 ? "" : "s") + "</div>" : "") +
        "<div style='margin-top:6px'>" + who + flags + "</div></button>";
    };
    var head = "<p class='meta' style='margin:2px 0 10px'>" + list.length + " departure" + (list.length === 1 ? "" : "s") + " · " + riders + " riders</p>";
    if (mgr) {
      var tot = list.reduce(function (s, d) { s.t += d.total_cents || 0; s.p += d.paid_cents || 0; s.o += d.due_cents || 0; s.b += d.bookings.length; s.sh += d.shuttle_seats || 0; return s; }, { t: 0, p: 0, o: 0, b: 0, sh: 0 });
      head = "<div class='card'><div class='stat'><div><b>" + money(tot.t) + "</b><span>booked · " + tot.b + " bookings</span></div><div><b>" + money(tot.p) + "</b><span>paid</span></div><div><b class='" + (tot.o ? "owe" : "") + "'>" + money(tot.o) + "</b><span>still owed</span></div></div>" +
        "<p class='meta' style='margin:8px 0 0'>" + list.length + " departure" + (list.length === 1 ? "" : "s") + " · " + riders + " riders" + (tot.sh ? " · 🚐 " + tot.sh + " shuttle seats" : "") + "</p></div>";
    }
    head = myRunsHtml() + head + (mgr ? shuttleCard(list) : "");
    if (S.view === "manager") $("main").innerHTML = chips + head + list.map(card).join("");
    else {
      var mineL = list.filter(function (d) { return d.mine; }), open = list.filter(function (d) { return !d.mine; });
      $("main").innerHTML = chips + head + "<h2 style='margin-top:4px'>Your bookings</h2>" + (mineL.length ? mineL.map(card).join("") : "<div class='card meta'>Nothing assigned to you on this day yet.</div>" + nextCard) +
        (open.length ? "<h2>Not assigned yet</h2>" + open.map(card).join("") : "");
    }
    wireChips(); wireNext(); wireRuns();
    each("button.card[data-pk]", function (b) { b.onclick = function () { enter(function () { S.open = b.getAttribute("data-pk"); }); }; });
  }

  function relDay(d) {
    if (d === S.today) return "Today · " + dayName(d);
    if (d === addD(S.today, 1)) return "Tomorrow · " + dayName(d);
    if (d === addD(S.today, -1)) return "Yesterday · " + dayName(d);

  }

  // ── season / upcoming: every day with bookings (managers: the whole season, past + future) ──
  function renderSeason() {
    var mgr = S.view === "manager";
    $("hd").innerHTML = "<button class='back' id='back'>‹ Day view</button><h1>" + (mgr ? "Season" : "Upcoming") + (S.seasonData ? " " + esc(S.seasonData.season.label) : "") + "</h1>" +
      "<div class='sub'><span>" + (mgr ? "Every day with bookings, past and future" : "Days with bookings for you") + "</span></div>" +
      (mgr ? "<div class='seg stabs'><button data-st='days' aria-pressed='" + (S.seasonTab !== "report") + "'>Days</button><button data-st='report' aria-pressed='" + (S.seasonTab === "report") + "'>Report</button></div>" : "");

    var sd = S.seasonData, days = sd.days.filter(function (x) { return !S.loc || x.by_location[S.loc] || (!mgr && x.mine); });
    var tot = days.reduce(function (s, x) { s.b += x.bookings; s.r += x.riders; return s; }, { b: 0, r: 0 });
    var counts = {}; sd.days.forEach(function (x) { Object.keys(x.by_location).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });

    h += "<p class='meta' style='margin:2px 0 4px'>" + days.length + " day" + (days.length === 1 ? "" : "s") + " · " + tot.b + " bookings · " + tot.r + " riders" +

    if (!days.length) h += "<div class='empty'>No bookings " + (mgr ? "this season" : "coming up") + (S.loc ? " at " + esc(locLabel(S.loc)) : "") + " yet.</div>";

      if (m !== month) { h += "<h3 class='mo'>" + esc(m) + "</h3>"; month = m; }
      if (!anchor && x.date >= sd.today) anchor = x.date;
      var locs = (sd.locations || []).filter(function (l) { return x.by_location[l.key]; }).map(function (l) { return "<span class='loc'>" + esc(l.label) + " " + x.by_location[l.key] + "</span>"; }).join("");
      h += "<button class='card day" + (x.date < sd.today ? " past" : "") + (x.date === sd.today ? " today" : "") + "' data-day='" + x.date + "' id='d" + x.date + "'>" +
        "<div><div class='dn'>" + esc(x.date === sd.today ? "Today" : x.date === addD(sd.today, 1) ? "Tomorrow" : dayName(x.date)) + "</div>" +
        "<div class='meta'>" + x.bookings + " booking" + (x.bookings === 1 ? "" : "s") + " · " + x.riders + " riders" + (x.first ? " · first " + esc(time(x.first.start_at)) : "") + (x.total_cents != null ? " · <b>" + money(x.total_cents) + "</b>" + (x.due_cents ? " <span class='owe'>(" + money(x.due_cents) + " owed)</span>" : "") : "") + "</div>" +
        "<div class='locs'>" + locs + "</div></div>" + (x.mine ? "<span class='pill mine'>" + x.mine + " MINE</span>" : "<span class='meta'>›</span>") + "</button>";
    });
    $("main").innerHTML = h;
    each("[data-loc]", function (c) { c.onclick = function () { S.loc = c.getAttribute("data-loc"); store.set("guideLoc", S.loc); renderSeason(); }; });
    each("[data-day]", function (b) { b.onclick = function () { S.season = false; S.open = null; load(b.getAttribute("data-day")).then(function () { scrollTo(0, 0); }); }; });
    if (anchor && mgr && $("d" + anchor)) $("d" + anchor).scrollIntoView({ block: "center" });   // the whole season: start at today / the next day
  }

  function srcLabel(src) { return src ? src.label + (src.agent ? " · " + src.agent : "") + (src.ref ? " (" + src.ref + ")" : "") : ""; }
  function srcList(d) { var seen = {}; return (d.bookings || []).map(function (b) { var l = b.source && b.source.label; if (!l || seen[l]) return ""; seen[l] = 1; return "<span class='src'>" + esc(l) + "</span>"; }).join(""); }

  // ── sleds / trailers, staff notes, van runs ──
  var KIND = { sled: "🛷 Sled", trailer: "🚚 Trailer", other: "Unit" };
  var RUNK = { to_trail: "To the trailhead", from_trail: "From the trailhead", between_locations: "Between locations", evening_pickup: "Evening pickup" };
  function canEquip() { return S.view === "manager" || S.view === "shop"; }
  function bookingExtras(b) {

      h += "<div class='shut'>🚐 " + x[1] + "<b>" + esc(r.vehicle || "Van") + "</b>" + (r.depart_at ? " · leaves " + esc(time(r.depart_at)) : "") + (r.driver ? " · driver " + esc(r.driver) : " · no driver yet") + "</div>"; });
    h += "<div>" + (b.units || []).map(function (u) { return "<span class='unit'>" + KIND[u.kind] + " " + esc(u.unit) + (canEquip() ? "<button aria-label='Remove' data-unit-del='" + esc(u.id) + "' data-b='" + esc(b.pk) + "'>×</button>" : "") + "</span>"; }).join("") + "</div>";
    if (canEquip()) {

        "<datalist id='" + dl + "'>" + [].concat((S.day.units || {}).sled || [], (S.day.units || {}).trailer || [], (S.day.units || {}).other || []).map(function (u) { return "<option value='" + esc(u) + "'>"; }).join("") + "</datalist>";
    }
    (b.staff_notes || []).forEach(function (n) {
      h += "<div class='snote'><span>" + esc(n.note) + "<br><span class='by'>" + esc(n.by || "Staff") + " · " + esc(dayName(String(n.at).slice(0, 10))) + "</span></span>" +
        (n.mine || S.view === "manager" ? "<button aria-label='Remove note' data-note-del='" + esc(n.id) + "' data-b='" + esc(b.pk) + "'>×</button>" : "") + "</div>";
    });
    h += "<div class='addrow' style='grid-template-columns:minmax(0,1fr) auto'><input id='nt" + esc(b.pk) + "' placeholder='Add a note for the team' maxlength='500'><button class='btn small ghost' data-note-add='" + esc(b.pk) + "'>Add note</button></div>";
    return h;
  }
  function runLine(r) {
    return esc(r.vehicle || "Van") + " · " + esc(RUNK[r.kind] || "") + (r.depart_at ? " · " + esc(time(r.depart_at)) : "") + " · " + r.used + "/" + r.seats + " seats · " +
      (r.driver_name ? "driver " + esc(r.driver_name) : "<span class='owe'>no driver</span>");
  }
  function shuttleCard(list) {
    var seats = list.reduce(function (n, d) { return n + (d.shuttle_seats || 0); }, 0), runs = S.day.runs || [];
    if (!seats && !runs.length) return "";
    var onRun = {}; runs.forEach(function (r) { if (r.kind === "to_trail") r.booking_pks.forEach(function (p) { onRun[p] = 1; }); });
    var waiting = []; list.forEach(function (d) { d.bookings.forEach(function (b) { if (b.shuttle && b.shuttle.seats && !onRun[b.pk]) waiting.push(b); }); });
    return "<div class='card'><div class='row'><div class='label'>🚐 Shuttles</div><span class='meta'>" + seats + " seat" + (seats === 1 ? "" : "s") + " requested</span></div>" +
      runs.map(function (r) { return "<button class='card run' style='margin:8px 0 0' data-run='" + esc(r.id) + "'><div class='time' style='font-size:15px'>" + runLine(r) + "</div>" +
        "<div class='meta'>" + r.stops.map(function (x) { return esc(String(x.name).split(" ")[0]) + " (" + x.seats + ")"; }).join(", ") + "</div></button>"; }).join("") +
      (waiting.length ? "<p class='meta' style='margin:8px 0 0'><span class='owe'>" + waiting.length + " booking" + (waiting.length === 1 ? "" : "s") + " not on a van yet</span>: " + esc(waiting.map(function (b) { return String(b.name).split(" ")[0] + " (" + b.shuttle.seats + ")"; }).join(", ")) + "</p>" +
        "<button class='btn dark' id='planRuns' style='margin-top:8px'>Plan van runs</button>" : "") +
      "<button class='btn small ghost' id='newRun' style='margin-top:8px'>+ New run</button></div>";
  }
  function myRunsHtml() {
    var mine = S.day.my_runs || []; if (!mine.length) return "";
    return "<h2 style='margin-top:4px'>Your van runs</h2>" + mine.map(function (r) {
      return "<div class='card run'><div class='time' style='font-size:15px'>" + runLine(r) + "</div>" + (r.notes ? "<div class='note'>" + esc(r.notes) + "</div>" : "") +
        r.stops.map(function (x, i) { return "<div class='stop'><b>" + (i + 1) + ". " + esc(x.name) + "</b> · " + x.seats + " seat" + (x.seats === 1 ? "" : "s") + (x.ride ? " · " + esc(x.ride) + (x.ride_at ? " " + esc(time(x.ride_at)) : "") : "") +
          (x.address ? "<div><a href='https://maps.google.com/?q=" + encodeURIComponent(x.address) + "' target='_blank' rel='noopener'>" + esc(x.address) + "</a></div>" : "<div class='meta'>No pickup address on the booking</div>") +
          (x.phone ? "<a class='btn small ghost' style='margin-top:6px' href='tel:" + esc(x.phone) + "'>Call " + esc(String(x.name).split(" ")[0]) + "</a>" : "") + "</div>"; }).join("") + "</div>";
    }).join("");
  }
  function wireRuns() {
    if ($("planRuns")) $("planRuns").onclick = function () { api("POST", "/guide/api/run", { action: "suggest", d: S.date }).then(function (j) { toast(j.created ? "Planned " + j.created + " van run" + (j.created === 1 ? "" : "s") + " + return" + (j.created === 1 ? "" : "s") + ". Pick drivers." : "Nothing to plan"); return load(S.date); }).catch(function (e) { toast(e.message); }); };
    if ($("newRun")) $("newRun").onclick = function () { enter(function () { S.editRun = { kind: "to_trail", seats: 25, booking_pks: [] }; }); };
    each("[data-run]", function (b) { b.onclick = function () { var r = (S.day.runs || []).filter(function (x) { return x.id === b.getAttribute("data-run"); })[0]; if (r) enter(function () { S.editRun = JSON.parse(JSON.stringify(r)); }); }; });
  }

    $("hd").innerHTML = "<button class='back' id='back'>‹ Bookings</button><h1>" + (r.id ? esc(r.vehicle || "Van run") : "New van run") + "</h1><div class='sub'><span>" + esc(dayName(S.date)) + "</span></div>";
    $("back").onclick = goBack;
    $("main").innerHTML = "<div class='card'>" +
      "<label class='f' for='rv'>Van</label><input id='rv' type='text' maxlength='40' value='" + esc(r.vehicle || "") + "' placeholder='Van 1'>" +
      "<label class='f' for='rk'>Run</label><select id='rk'>" + Object.keys(RUNK).map(function (k) { return "<option value='" + k + "'" + (r.kind === k ? " selected" : "") + ">" + RUNK[k] + "</option>"; }).join("") + "</select>" +

      "<label class='f' for='rd'>Driver</label><select id='rd'><option value=''>No driver yet</option>" + drivers.map(function (x) { return "<option value='" + esc(x.phone) + "'" + (r.driver_phone === x.phone ? " selected" : "") + ">" + esc(x.name) + " · " + esc(x.role) + "</option>"; }).join("") + "</select>" +
      "<label class='f' for='rn'>Note for the driver</label><input id='rn' type='text' maxlength='300' value='" + esc(r.notes || "") + "'></div>" +
      "<h2>Who rides</h2><div class='card pick'>" + (all.length ? all.map(function (x) {
        var b = x.b, s = b.shuttle && b.shuttle.seats ? b.shuttle.seats : 0;
        return "<label><input type='checkbox' value='" + esc(b.pk) + "'" + (r.booking_pks.indexOf(b.pk) > -1 ? " checked" : "") + "> <span><b>" + esc(b.name) + "</b> · " + (s ? s + " shuttle seat" + (s === 1 ? "" : "s") : "party of " + b.pax + ", no shuttle asked") +
          "<br><span class='meta'>" + esc(time(x.d.start_at)) + " " + esc(x.d.label) + (b.shuttle && b.shuttle.address ? " · " + esc(b.shuttle.address) : "") + (b.run && b.run.id !== r.id ? " · already on " + esc(b.run.vehicle || "a van") : "") + "</span></span></label>"; }).join("") : "<p class='meta'>No bookings this day.</p>") +
      "<p class='hint'>Pickups go in this order.</p></div>" + (r.id ? "<button class='btn ghost' id='delRun' style='margin-top:8px'>Delete this run</button>" : "");

  }

  // ── managers: season report ──
  function renderReport(sd) {
    var r = sd.report; if (!r) { $("main").innerHTML = "<div class='empty'>No report for this view.</div>"; return; }
    var stat = function (o) { return "<div class='stat'><div><b>" + money(o.total_cents) + "</b><span>" + o.bookings + " bookings · " + o.riders + " riders</span></div><div><b>" + money(o.paid_cents) + "</b><span>paid</span></div><div><b class='" + (o.due_cents ? "owe" : "") + "'>" + money(o.due_cents) + "</b><span>owed</span></div></div>"; };
    var rows = function (list, label, sub) {
      var max = Math.max.apply(null, list.map(function (x) { return x.total_cents; }).concat([1]));
      return list.map(function (x) { return "<div class='rrow'><span><b>" + esc(label(x)) + "</b>" + (sub ? " <span class='meta'>" + esc(sub(x) || "") + "</span>" : "") + "</span><span><b>" + money(x.total_cents) + "</b> <span class='meta'>· " + x.bookings + " bk · " + x.riders + " riders</span></span>" +
        "<i style='width:" + Math.max(2, Math.round(100 * x.total_cents / max)) + "%'></i></div>"; }).join("") || "<p class='meta'>Nothing yet.</p>";
    };

      if (b.shuttle && b.shuttle.seats) h += "<div class='shut'>🚐 <b>Shuttle</b> · " + b.shuttle.seats + " seat" + (b.shuttle.seats === 1 ? "" : "s") + (b.shuttle.address ? " · " + esc(b.shuttle.address) : "") + "</div>";
      else if (b.shuttle && b.shuttle.evening_pickup) h += "<div class='shut'>🌙 <b>Pickup the evening before</b>" + (b.shuttle.address ? " · " + esc(b.shuttle.address) : "") + "</div>";

          gl.map(function (x) { return "<option value='" + esc(x.phone) + "'" + (cur && cur.name === x.name ? " selected" : "") + ">" + esc(x.name) + (x.home_location ? " · " + esc(locLabel(x.home_location)) : "") + "</option>"; }).join("") + "</select></div>";
      } else if (d.details && (b.guides || []).length) h += "<div class='meta' style='margin-top:4px'>Guide: " + esc(b.guides.map(function (g) { return g.me ? "you" : g.name; }).join(", ")) + "</div>";
      (b.notes || []).filter(function (n) { return !(b.shuttle && /shuttle|address|pickup evening/i.test(n.label)); }).forEach(function (n) { h += "<div class='note" + (n.health ? " health" : "") + "'><b>" + esc(n.label) + ":</b> " + esc(n.value) + "</div>"; });
      if (b.equipment) h += "<div class='note'><b>Gear:</b> " + esc(b.equipment) + "</div>";
      if (d.details) h += bookingExtras(b);
      if (b.phone) h += "<a class='btn small ghost' style='margin-top:8px' href='tel:" + esc(b.phone) + "'>Call " + esc(String(b.name).split(" ")[0]) + "</a>";
      return h + "</div>";

  }
  function guideOptions(d) {

  }
  function renderRide(d) {
    var def = d.defaults || {}, dr = S.drafts[String(d.availability_pk)];

        return ((b.home_location === d.location) - (a.home_location === d.location)) || String(a.name).localeCompare(String(b.name)); });
      h += "<div class='card'><div class='label'>Guides on this departure</div>" + (d.assignees.length ? d.assignees.map(function (x) {
        var st = (S.day.staff || []).filter(function (p) { return p.name === x.name; })[0];
        return "<div class='row' style='align-items:center;margin-top:6px'><span>" + esc(x.name || "?") + (x.riders ? " <span class='meta'>(" + x.riders.length + " bookings)</span>" : "") +
          " <span class='meta'>· " + esc(x.source === "fareharbor" ? "from FareHarbor" : x.source === "manager" ? "assigned" : "took it") + "</span></span>" +
          (st && st.phone ? "<button class='btn small ghost unassign' data-phone='" + esc(st.phone) + "'>Remove</button>" : "") + "</div>"; }).join("") : "<p class='meta'>Nobody yet.</p>") +
        "<label class='f' for='who'>Assign</label><select id='who'><option value=''>Pick a person…</option>" + opts.map(function (x) {
          return "<option value='" + esc(x.phone) + "'>" + esc(x.name) + " · " + esc(x.role) + (x.home_location ? " · " + esc(locLabel(x.home_location)) : "") + "</option>"; }).join("") + "</select>" +

    if (S.view === "manager" && d.total_cents != null) h += "<div class='card'><div class='stat'><div><b>" + money(d.total_cents) + "</b><span>booked</span></div><div><b>" + money(d.paid_cents) + "</b><span>paid</span></div><div><b class='" + (d.due_cents ? "owe" : "") + "'>" + money(d.due_cents) + "</b><span>owed</span></div></div>" +
      (d.shuttle_seats ? "<p class='meta' style='margin:8px 0 0'>🚐 " + d.shuttle_seats + " shuttle seat" + (d.shuttle_seats === 1 ? "" : "s") + " requested · " + (d.bookings.every(function (b) { return !(b.shuttle && b.shuttle.seats) || b.run; }) ? "all on a van" : "plan van runs on the day list") + "</p>" : "") + "</div>";
    h += manifestHtml(d);
    var live = canLog();
    h += "<h2>Photos</h2><div class='grid' id='grid'>" + d.photos.map(function (p) {
      return "<div class='ph'><img src='" + esc(p.thumb) + "' alt='Ride photo' loading='lazy'>" +
        "<button class='star' aria-label='Use as cover' aria-pressed='" + p.cover + "' data-id='" + esc(p.id) + "'>★</button>" +
        (p.mine || S.view === "manager" ? "<button class='del' aria-label='Remove photo' data-id='" + esc(p.id) + "'>✕</button>" : "") + "</div>";
    }).join("") + S.queue.filter(function (q) { return q.pk === String(d.availability_pk) && !q.done && !q.gaveUp; }).map(function (q) {
      return "<div class='ph up'>" + (q.failed ? "Retrying…" : "Uploading…") + "</div>";
    }).join("") + "</div>" +
      (live ? "<p class='hint'>★ = the photo in the guests' email. Add the group shot first.</p>" +
      "<button class='btn dark' id='add' style='margin-top:8px'>Add photos</button>" : (d.photos.length ? "" : "<p class='meta'>" + (S.date > S.today ? "Photos and ride details open on the day of the ride." : "No photos for this ride.") + "</p>"));
    if (!live) { $("main").innerHTML = h; $("bar").hidden = true; wireRide(d); return; }
    var cond = log.conditions || [];
    h += "<h2>About the ride</h2><div class='card'>" +
      "<label class='f' for='miles'>Miles</label><input id='miles' type='number' inputmode='decimal' value='" + esc(log.miles != null ? log.miles : "") + "' placeholder='" + esc(def.miles != null ? def.miles + " (usual)" : "") + "'>" +
      "<label class='f' for='hp'>High point (ft)</label><input id='hp' type='number' inputmode='numeric' value='" + esc(log.high_point_ft != null ? log.high_point_ft : "") + "' placeholder='" + esc(def.high_point_ft != null ? def.high_point_ft + " (usual)" : "") + "'>" +
      "<div class='hint'>Leave blank to use the usual numbers for this tour.</div>" +
      "<label class='f' for='stops'>Stops (comma separated)</label><input id='stops' type='text' value='" + esc((log.stops && log.stops.length ? log.stops : []).join(", ")) + "' placeholder='" + esc((def.stops || []).join(", ")) + "'>" +
      "<label class='f'>Conditions</label><div class='chips' id='cond'>" + COND.map(function (c) { return "<button class='chip' type='button' data-c='" + c[0] + "' aria-pressed='" + (cond.indexOf(c[0]) > -1) + "'>" + c[1] + "</button>"; }).join("") + "</div>" +
      "<label class='f' for='hl'>Highlight (in the guests' email)</label><input id='hl' type='text' maxlength='140' value='" + esc(log.highlight || "") + "' placeholder='Moose at Rabbit Ears, first powder day…'>" +
      "<label class='f' for='note'>Note about the group (internal, never sent)</label><textarea id='note' maxlength='500'>" + esc(log.group_note || "") + "</textarea></div>";
    $("main").innerHTML = h;
    $("bar").hidden = false;
    $("barIn").innerHTML = "<button class='btn ghost' id='save'>Save</button><button class='btn primary' id='done'>" + (log.status === "done" ? "Saved ✓ Done" : "Save + done") + "</button>";

  }
  function wireRide(d) {
    var pk = d.availability_pk;
    if ($("claim")) $("claim").onclick = function () { api("POST", "/guide/api/claim", { availability_pk: pk, d: S.date }).then(function () { toast("It's yours"); return load(S.date); }).catch(function (e) { toast(e.message); }); };
    if ($("claimSome")) $("claimSome").onclick = function () {
      var ticked = Array.prototype.map.call($("riders").querySelectorAll("input:checked"), function (i) { return i.value; });
      if (!ticked.length) { toast("Tick your riders first"); return; }
      api("POST", "/guide/api/claim", { availability_pk: pk, booking_pks: ticked, d: S.date }).then(function () { toast("Claimed " + ticked.length); return load(S.date); }).catch(function (e) { toast(e.message); });
    };
    if ($("assign")) $("assign").onclick = function () { var ph = $("who").value; if (!ph) { toast("Pick a person"); return; }
      api("POST", "/guide/api/assign", { availability_pk: pk, phone: ph, d: S.date }).then(function () { toast("Assigned"); return load(S.date); }).catch(function (e) { toast(e.message); }); };
    each(".unassign", function (b) { b.onclick = function () { api("POST", "/guide/api/assign", { availability_pk: pk, phone: b.getAttribute("data-phone"), remove: true, d: S.date }).then(function () { return load(S.date); }); }; });
    each("[data-unit-add]", function (btn) { btn.onclick = function () {
      var pkb = btn.getAttribute("data-unit-add"), k = $("uk" + pkb), v = $("uv" + pkb);
      if (!v.value.trim()) { toast("Type the sled or trailer name"); return; }
      api("POST", "/guide/api/equipment", { booking_pk: pkb, kind: k.value, unit: v.value, d: S.date }).then(function () { toast("Added"); return load(S.date); }).catch(function (e) { toast(e.message); }); }; });
    each("[data-unit-del]", function (btn) { btn.onclick = function () {
      api("POST", "/guide/api/equipment", { booking_pk: btn.getAttribute("data-b"), remove_id: btn.getAttribute("data-unit-del"), d: S.date }).then(function () { return load(S.date); }).catch(function (e) { toast(e.message); }); }; });
    each("[data-note-add]", function (btn) { btn.onclick = function () {

    each("[data-note-del]", function (btn) { btn.onclick = function () { if (!confirm("Remove this note?")) return;
      api("POST", "/guide/api/note", { booking_pk: btn.getAttribute("data-b"), remove_id: btn.getAttribute("data-note-del"), d: S.date }).then(function () { return load(S.date); }).catch(function (e) { toast(e.message); }); }; });
    each("select.bg", function (sel) { sel.onchange = function () {

        .then(function () { toast(sel.value ? "Guide set" : "Removed"); return load(S.date); }).catch(function (e) { toast(e.message); load(S.date); }); }; });
    if ($("release")) $("release").onclick = function (ev) { ev.preventDefault(); api("POST", "/guide/api/claim", { availability_pk: pk, release: true, d: S.date }).then(function () { return load(S.date); }); };
    each(".star", function (b) { b.onclick = function () { api("POST", "/guide/api/media", { id: b.getAttribute("data-id"), action: "cover" }).then(function () { return load(S.date); }); }; });
    each(".del", function (b) { b.onclick = function () { if (!confirm("Remove this photo?")) return; api("POST", "/guide/api/media", { id: b.getAttribute("data-id"), action: "remove" }).then(function () { return load(S.date); }); }; });

      "<h2>Route map</h2><div class='card'>" + (t.map_url ? "<img class='map' src='" + esc(t.map_url) + "' alt='Route map'>" : "<p class='meta'>No map yet.</p>") +

      api("POST", "/guide/api/admin/tour", { label: t.label, miles: $("tmiles").value, high_point_ft: $("thp").value, duration_hours: $("tdur").value, description: $("tdesc").value, stops: st })

  function uploadMap(t, file) {
    if (!file) return;
    toast("Uploading map…");
    var fr = new FileReader();
    fr.onload = function () {
      api("POST", "/guide/api/admin/map", { label: t.label, content_type: file.type || "image/png", data: String(fr.result).split(",")[1] })
        .then(function (j) { t.map_url = j.map_url; toast("Map saved"); render(); }).catch(function (e) { toast(e.message); });
    };
    fr.readAsDataURL(file);
  }

  // ── manager: staff ──
  var ROLE_L = { guide: "Guide", shop: "Shop", driver: "Driver", mechanic: "Mechanic", manager: "Manager" };
  function renderStaff() {
    $("hd").innerHTML = headerTop("Settings") + tabs(); wireHeader();
    if (!S.admin) { $("main").innerHTML = "<div class='empty'><span class='spin'></span>Loading…</div>"; $("bar").hidden = true; return; }
    var list = S.admin.staff || [], locs = S.admin.locations || [];
    var byLoc = function (k) { return list.filter(function (x) { return (x.home_location || "") === k; }); };
    var row = function (x, i) { return "<button class='card' data-si='" + i + "'><div class='row'><div><div class='label'>" + esc(x.display_name) + "</div><div class='meta'>" + esc(ROLE_L[x.role] || x.role) +
      (x.phone ? " · " + esc(x.phone) : " · no phone") + (x.source === "briefing" ? " · from briefing list" : "") + "</div></div></div></button>"; };
    var h = "<p class='meta'>Everyone who works a booking, delivery or shop job. Their phone gets the morning link; assignments use it.</p>";
    locs.concat([{ key: "", label: "No home location yet" }]).forEach(function (l) {
      var people = byLoc(l.key); if (!people.length) return;
      h += "<h2>" + esc(l.label) + "</h2>" + people.map(function (x) { return row(x, list.indexOf(x)); }).join("");
    });
    $("main").innerHTML = h;
    $("bar").hidden = false; $("barIn").innerHTML = "<button class='btn primary' id='addStaff'>Add a person</button>";
    $("addStaff").onclick = function () { enter(function () { S.editStaff = { role: "guide", active: true }; }); };
    each("[data-si]", function (b) { b.onclick = function () { enter(function () { S.editStaff = Object.assign({}, list[Number(b.getAttribute("data-si"))]); }); }; });
  }
  function renderStaffEdit() {
    var x = S.editStaff, locs = (S.admin && S.admin.locations) || [], roles = (S.admin && S.admin.roles) || [];
    $("hd").innerHTML = "<button class='back' id='back'>‹ Staff</button><h1>" + esc(x.display_name || "New person") + "</h1>";
    $("back").onclick = goBack;
    $("main").innerHTML = "<div class='card'>" +
      "<label class='f' for='sn'>Name</label><input id='sn' type='text' value='" + esc(x.display_name || "") + "'>" +
      "<label class='f' for='sr'>Role</label><select id='sr'>" + roles.map(function (r) { return "<option value='" + r + "'" + (x.role === r ? " selected" : "") + ">" + (ROLE_L[r] || r) + "</option>"; }).join("") + "</select>" +
      "<label class='f' for='sl'>Home location</label><select id='sl'><option value=''>Not set</option>" + locs.map(function (l) { return "<option value='" + l.key + "'" + (x.home_location === l.key ? " selected" : "") + ">" + esc(l.label) + "</option>"; }).join("") + "</select>" +
      "<label class='f' for='sp'>Mobile phone</label><input id='sp' type='text' inputmode='tel' value='" + esc(x.phone || "") + "' placeholder='(970) 555-0123'>" +
      "<label class='f' for='sg'>Google email (for sign-in later)</label><input id='sg' type='text' inputmode='email' value='" + esc(x.google_email || "") + "'>" +
      "<label style='display:flex;gap:10px;align-items:center;margin-top:12px'><input id='sa' type='checkbox'" + (x.active !== false ? " checked" : "") + " style='width:22px;height:22px'> Working this season</label></div>";
    $("bar").hidden = false; $("barIn").innerHTML = "<button class='btn primary' id='saveStaff'>Save</button>";
    $("saveStaff").onclick = function () {
      api("POST", "/guide/api/admin/staff", { id: x.id || null, name: $("sn").value, role: $("sr").value, home_location: $("sl").value, phone: $("sp").value, google_email: $("sg").value, active: $("sa").checked })
        .then(function () { toast("Saved"); S.admin = null; goBack(); return loadAdmin(); }).catch(function (e) { toast(e.message); });
    };
  }

  // ── manager: recap settings ──
  function renderSettings() {
    $("hd").innerHTML = headerTop("Settings") + tabs(); wireHeader();
    if (!S.admin) { $("main").innerHTML = "<div class='empty'><span class='spin'></span>Loading…</div>"; $("bar").hidden = true; return; }
    var st = S.admin.settings;
    if (!st) { $("main").innerHTML = "<div class='card err'>Recap settings not found.</div>"; return; }
    var FEAT = { review: "Google review ask", share: "Bring a friend (" + esc(st.friend_code) + ")", newsletter: "Newsletter signup", merch: "Gear from your ride", prints: "Photo prints offer" };
    var hours = ""; for (var hh = 12; hh <= 22; hh++) hours += "<option value='" + hh + "'" + (st.send_hour === hh ? " selected" : "") + ">" + ((hh % 12) || 12) + (hh < 12 ? " am" : " pm") + "</option>";
    $("main").innerHTML = "<h2>Ride Recap emails</h2><div class='card'>" +
      "<div class='row'><div class='label'>Sending to guests</div>" + (st.dry_run ? "<span class='pill bad'>TEST ONLY</span>" : "<span class='pill good'>LIVE</span>") + "</div>" +
      "<p class='hint'>" + (st.dry_run ? "Every recap goes to " + esc(st.test_to) + " with [TEST] in the subject. Going live is switched on by Sean." : "Guests get their recap the evening of their ride.") + "</p>" +
      "<label class='f' for='sh'>Send at</label><select id='sh'>" + hours + "</select>" +
      "<label class='f' for='tpl'>Email design</label><select id='tpl'>" + st.templates.map(function (x) { return "<option value='" + x + "'" + (st.template === x ? " selected" : "") + ">" + (x === "simple" ? "Simple (new)" : "Classic (v1)") + "</option>"; }).join("") + "</select>" +
      "<label class='f'>Sections</label><div class='chips' id='feat'>" + st.all_features.map(function (f) {
        return "<button type='button' class='chip' data-f='" + f + "' aria-pressed='" + (st.features.indexOf(f) > -1) + "'>" + (FEAT[f] || f) + "</button>"; }).join("") + "</div>" +
      "<p class='hint'>Gear and prints stay off until they're ready to sell.</p></div>";
    each("#feat .chip", function (c) { c.onclick = function () { c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") !== "true"); }; });
    $("bar").hidden = false; $("barIn").innerHTML = "<button class='btn primary' id='saveSet'>Save settings</button>";
    $("saveSet").onclick = function () {
      var feats = Array.prototype.filter.call(document.querySelectorAll("#feat .chip"), function (c) { return c.getAttribute("aria-pressed") === "true"; }).map(function (c) { return c.getAttribute("data-f"); });
      api("POST", "/guide/api/admin/settings", { send_hour: Number($("sh").value), template: $("tpl").value, features: feats })
        .then(function () { toast("Settings saved"); S.admin = null; return loadAdmin(); }).catch(function (e) { toast(e.message); });
    };
  }

  // ── photo upload: shrink to a 1600px JPEG on the phone (iPhone HEIC included), then upload one at a time, retrying ──
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("could not read photo")); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("This photo type can't be read")); };
      img.src = url;
    });
  }
  function b64(blob) { return new Promise(function (r) { var f = new FileReader(); f.onload = function () { r(String(f.result).split(",")[1]); }; f.readAsDataURL(blob); }); }
  function uid() { return (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }
  function enqueue(pk, files) {
    Array.prototype.forEach.call(files || [], function (f) { if (/^image\//.test(f.type) || /\.(heic|heif|jpe?g|png)$/i.test(f.name)) S.queue.push({ pk: String(pk), d: S.date, file: f, id: uid(), tries: 0 }); });
    toast("Uploading " + S.queue.filter(function (q) { return !q.done && !q.gaveUp; }).length + " photo(s)…");
    render(); pump();
  }
  function pump() {
    if (S.uploading) return;
    var q = S.queue.filter(function (x) { return !x.done && !x.gaveUp; })[0];
    if (!q) { if (S.queue.length) { S.queue = []; load(S.date); } return; }
    S.uploading = 1;
    shrink(q.file).then(b64).then(function (data) {
      return api("POST", "/guide/api/photo", { availability_pk: q.pk, d: q.d, data: data, content_type: "image/jpeg", client_id: q.id });
    }).then(function () { q.done = true; }).catch(function (e) {
      q.tries++; q.failed = true;
      if (e.status && e.status < 500 && e.status !== 408) { q.gaveUp = true; toast(e.message); return; }
      if (q.tries >= 6) { q.gaveUp = true; toast("A photo didn't upload. Check your signal and add it again."); return; }
      return new Promise(function (r) { setTimeout(r, Math.min(30000, 2000 * Math.pow(2, q.tries))); });   // weak signal: back off and retry
    }).then(function () { S.uploading = 0; render(); pump(); });
  }
  window.addEventListener("beforeunload", function (e) { if (S.uploading) { e.preventDefault(); e.returnValue = ""; } });
  // ── open team access: team code once, then "who are you?" ──
  function renderTeamCode(msg) {
    $("hd").innerHTML = "<h1>Ride Log</h1><div class='sub'><span>Colorado Sled Rentals · Rabbit Ears Adventures</span></div>";
    $("bar").hidden = true;
    $("main").innerHTML = (msg ? "<div class='card err'>" + esc(msg) + "</div>" : "") +
      "<div class='card'><label class='f' for='code'>Team code</label><input id='code' type='text' autocomplete='off' autocapitalize='off' inputmode='text'>" +
      "<p class='hint'>Ask a manager for it. You only enter it once on this phone.</p><button class='btn primary' id='go' style='margin-top:8px'>Continue</button></div>";
    var go = function () {
      var code = $("code").value.trim(); if (!code) return;
      fetch("/guide/api/team?code=" + encodeURIComponent(code)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Try again"); return j; }); })
        .then(function (j) { renderWho(code, j.people || []); }).catch(function (e) { renderTeamCode(e.message); });
    };
    $("go").onclick = go; $("code").onkeydown = function (e) { if (e.key === "Enter") go(); };
  }
  function renderWho(code, people) {
    $("main").innerHTML = "<h2>Who are you?</h2>" + (people.length ? people.map(function (p, i) {
      return "<button class='role' data-i='" + i + "'><b>" + esc(p.name) + "</b><span>" + esc(p.role) + (p.home_location ? " · " + esc(p.home_location.replace("_", " ")) : "") + "</span></button>"; }).join("")
      : "<div class='card'>No staff yet. A manager adds people in Settings, Staff.</div>");
    each(".role[data-i]", function (b) { b.onclick = function () {
      var p = people[Number(b.getAttribute("data-i"))];
      try { localStorage.setItem("guideTeam", JSON.stringify({ code: code, phone: p.phone })); } catch (e) {}
      T = "team:" + code + ":" + p.phone; S.view = null; load();
    }; });
  }
  window.__signOut = function () { try { localStorage.removeItem("guideTeam"); localStorage.removeItem("guideView"); } catch (e) {} T = ""; S.view = null; S.day = null; renderTeamCode(); };
  if (!T) renderTeamCode();
  else load();
})();
</script>
